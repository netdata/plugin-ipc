# Scan the Go standard library Netdata ships. go.mod keeps Netdata's
# `go 1.27.0` directive, while Netdata builds with the patch release pinned
# in netdata/netdata packaging/check-for-go-toolchain.sh. Keep this value
# equal to that pin and bump it whenever Netdata bumps it.
GoVersionOverride = "1.27.3"
