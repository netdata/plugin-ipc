name: macOS

on:
  push:
    branches:
      - main
    paths:
      - CMakeLists.txt
      - src/**
      - tests/**
      - .github/workflows/macos.yml
  pull_request:
    branches:
      - main
    paths:
      - CMakeLists.txt
      - src/**
      - tests/**
      - .github/workflows/macos.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stream-baseline:
    # macOS runs the UDS stream baseline (docs/level1-posix-uds.md); it has
    # no SHM profile, so the SHM suites are not built.
    name: macOS stream baseline (C, Rust, Go, interop)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: src/go/go.mod

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build
        run: |
          cmake -S . -B build
          cmake --build build -j "$(sysctl -n hw.ncpu)"

      - name: CTest
        run: ctest --test-dir build --output-on-failure

      - name: Rust tests
        working-directory: src/crates/netipc
        run: cargo test --locked

      - name: Go tests
        working-directory: src/go
        run: go test -count=1 ./...

      - name: Interop
        run: |
          bash tests/test_uds_interop.sh
          bash tests/test_service_interop.sh
          bash tests/test_cache_interop.sh
          bash tests/test_lookup_scale_interop.sh
          bash tests/interop_codec.sh
