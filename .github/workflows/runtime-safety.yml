name: Runtime Safety

on:
  push:
    branches:
      - main
    paths:
      - CMakeLists.txt
      - bench/**
      - src/**
      - tests/**
      - .github/workflows/runtime-safety.yml
  pull_request:
    branches:
      - main
    paths:
      - CMakeLists.txt
      - bench/**
      - src/**
      - tests/**
      - .github/workflows/runtime-safety.yml
  schedule:
    - cron: "43 04 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shm-timeout-abi:
    name: ARM SHM timeout ABI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install ARM compiler and emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-linux-gnueabihf libc6-dev-armhf-cross qemu-user
      - name: Check legacy and time64 libc layouts
        env:
          NIPC_TEST_RUNNER: qemu-arm
        run: |
          bash tests/run-shm-timeout-abi.sh arm-linux-gnueabihf-gcc -static
          bash tests/run-shm-timeout-abi.sh arm-linux-gnueabihf-gcc -static -D_TIME_BITS=64 -D_FILE_OFFSET_BITS=64 -DNIPC_TEST_REQUIRE_TIME64_32

      - name: Check Rust ARM musl legacy and time64 layouts
        run: |
          rustup target add arm-unknown-linux-musleabihf
          bash tests/run-rust-shm-timeout-abi.sh

  linux-architectures:
    name: Linux architectures (Go vet)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: src/go/go.mod
          cache: false

      - name: Vet Go on every Linux architecture
        working-directory: src/go
        run: |
          for arch in amd64 386 arm arm64 riscv64 loong64 ppc64le s390x mips64le; do
            echo "== GOARCH=$arch"
            GOARCH=$arch go vet ./...
          done

  linux-targets:
    # Every Linux target Netdata ships: C, Rust and Go suites plus interop.
    name: Linux target ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-musl
          - i386-gnu
          - i386-musl
          - armv7-gnu
          - armv7-gnu-time64
          - armv7-musl
          - armv6-musl
          - aarch64-gnu
          - aarch64-musl
    env:
      TARGET: ${{ matrix.target }}
      ZIG_VERSION: 0.17.0
      ZIG_SHA256: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: src/go/go.mod
          cache: false

      - name: Install cross compilers and emulator
        # binfmt is required, not just a runner: tests re-exec their own
        # binaries and interop scripts start foreign servers and clients.
        run: |
          pkgs="cmake ninja-build qemu-user-binfmt"
          case "$TARGET" in
            i386-*) pkgs="$pkgs gcc-i686-linux-gnu libc6-dev-i386-cross" ;;
            armv*) pkgs="$pkgs gcc-arm-linux-gnueabihf libc6-dev-armhf-cross" ;;
            aarch64-*) pkgs="$pkgs gcc-aarch64-linux-gnu libc6-dev-arm64-cross" ;;
          esac
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $pkgs

      - name: Install Zig for musl C builds
        if: contains(matrix.target, 'musl')
        run: |
          archive="zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://ziglang.org/download/${ZIG_VERSION}/${archive}"
          echo "${ZIG_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Build and test C, Rust, Go and interop
        env:
          NIPC_TARGET_RUSTUP_ADD: "1"
        run: bash tests/run-linux-target.sh "$TARGET"

  asan-ubsan:
    name: ASAN/UBSAN
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Run ASAN/UBSAN validation
        run: bash tests/run-sanitizer-asan.sh

  tsan:
    name: TSAN
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Run TSAN validation
        run: bash tests/run-sanitizer-tsan.sh

  valgrind:
    name: Valgrind
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends valgrind

      - name: Run Valgrind validation
        run: bash tests/run-valgrind.sh

  go-race:
    name: Go Race Detector
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: src/go/go.mod
          cache: false

      - name: Run Go race detector
        run: bash tests/run-go-race.sh

  shm-full-backing-store:
    name: SHM Full Backing Store
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: src/go/go.mod
          cache: false

      - name: Build C, Rust, and Go SHM creators
        run: |
          cmake -S . -B build-shm-regression
          cmake --build build-shm-regression --parallel 2 \
            --target interop_shm_c interop_shm_rs interop_shm_go

      - name: Require real tmpfs capacity-exhaustion regression
        run: |
          ctest_bin="$(dirname "$(command -v cmake)")/ctest"
          test -x "$ctest_bin"
          sudo env \
            PATH="$PATH" \
            NIPC_REQUIRE_TMPFS_TEST=1 \
            "$ctest_bin" \
              --test-dir build-shm-regression \
              --output-on-failure \
              --no-tests=error \
              -R '^test_shm_full_backing_store$'

  windows-msys:
    name: Windows MSYS2 Runtime
    runs-on: windows-latest
    timeout-minutes: 45

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: src/go/go.mod
          cache: false

      - name: Set up MSYS2
        uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c # v2
        with:
          msystem: MSYS
          update: true
          path-type: inherit
          install: >-
            base-devel
            gcc
            cmake
            ninja
            git

      - name: Build Windows runtime targets
        run: |
          set -euo pipefail
          windows_cargo_home="${CARGO_HOME:-}"
          if [[ -z "$windows_cargo_home" && -n "${USERPROFILE:-}" ]]; then
            windows_cargo_home="$(cygpath -u "$USERPROFILE")/.cargo"
          fi
          windows_cargo_home="${windows_cargo_home:-$HOME/.cargo}"
          export PATH="$windows_cargo_home/bin:$PATH"
          cargo check \
            --manifest-path src/crates/netipc/Cargo.toml \
            --all-targets \
            --all-features \
            --locked
          cmake -S . -B build-windows -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=/usr/bin/gcc \
            -DCMAKE_CXX_COMPILER=/usr/bin/g++
          cmake --build build-windows \
            --parallel "$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo 4)" \
            --target \
            test_named_pipe \
            test_win_shm \
            test_win_service \
            test_win_service_payload_limits \
            test_win_robustness \
            test_win_service_extra \
            test_win_service_guards \
            test_win_service_guards_extra \
            test_win_stress \
            interop_named_pipe_c \
            interop_named_pipe_rs \
            interop_named_pipe_go \
            interop_win_shm_c \
            interop_win_shm_rs \
            interop_win_shm_go \
            interop_service_win_c \
            interop_service_win_rs \
            interop_service_win_go \
            interop_cache_win_c \
            interop_cache_win_rs \
            interop_cache_win_go

      - name: Run Windows runtime tests
        run: |
          set -euo pipefail
          ctest --test-dir build-windows --output-on-failure -j1 -R "^(test_named_pipe|test_win_shm|test_win_service|test_win_service_payload_limits|test_win_robustness|test_win_service_extra|test_win_service_guards|test_win_service_guards_extra|test_named_pipe_interop|test_win_shm_interop|test_service_win_interop|test_service_win_shm_interop|test_cache_win_interop|test_cache_win_shm_interop)$"
